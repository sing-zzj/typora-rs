<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled - Typora RS</title>
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <link id="highlight-light" rel="stylesheet" href="./vendor/highlight/github.min.css" />
    <link id="highlight-dark" rel="stylesheet" href="./vendor/highlight/github-dark.min.css" disabled />
    <link rel="stylesheet" href="./style.css" />
    <script src="./vendor/katex/katex.min.js" defer></script>
    <script src="./vendor/mermaid/mermaid.min.js" defer></script>
    <script src="./vendor/highlight/highlight.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="app-menu" role="menubar" aria-label="应用菜单">
      <button class="menu-trigger" data-menu="file" aria-haspopup="true">File</button>
      <button class="menu-trigger" data-menu="edit" aria-haspopup="true">Edit</button>
      <button class="menu-trigger" data-menu="paragraph" aria-haspopup="true">Paragraph</button>
      <button class="menu-trigger" data-menu="format" aria-haspopup="true">Format</button>
      <button class="menu-trigger" data-menu="view" aria-haspopup="true">View</button>
      <button class="menu-trigger" data-menu="theme" aria-haspopup="true">Theme</button>
      <button class="menu-trigger" data-menu="help" aria-haspopup="true">Help</button>

      <div class="menu-popup" id="menu-file" role="menu" hidden>
        <button role="menuitem" data-action="open">Open… <span>Ctrl+O</span></button>
        <button role="menuitem" data-action="save">Save <span>Ctrl+S</span></button>
        <button role="menuitem" data-action="save-as">Save As…</button>
        <hr />
        <button role="menuitem" data-action="export-html">Export <span>HTML</span></button>
        <button role="menuitem" data-action="export-pdf">Print / Export PDF…</button>
        <hr />
        <button role="menuitem" data-action="preferences">Preferences… <span>Ctrl+,</span></button>
      </div>
      <div class="menu-popup" id="menu-edit" role="menu" hidden>
        <button role="menuitem" data-action="undo">Undo <span>Ctrl+Z</span></button>
        <button role="menuitem" data-action="redo">Redo <span>Ctrl+Y</span></button>
        <hr />
        <button role="menuitem" data-action="find">Find… <span>Ctrl+F</span></button>
        <button role="menuitem" data-action="replace">Find and Replace… <span>Ctrl+H</span></button>
        <button role="menuitem" data-action="select-all">Select All <span>Ctrl+A</span></button>
      </div>
      <div class="menu-popup" id="menu-paragraph" role="menu" hidden>
        <button role="menuitem" data-action="heading" data-level="1">Heading 1 <span>Ctrl+Alt+1</span></button>
        <button role="menuitem" data-action="heading" data-level="2">Heading 2 <span>Ctrl+Alt+2</span></button>
        <button role="menuitem" data-action="heading" data-level="3">Heading 3 <span>Ctrl+Alt+3</span></button>
        <button role="menuitem" data-action="paragraph">Paragraph</button>
        <hr />
        <button role="menuitem" data-action="unordered-list">Unordered List</button>
        <button role="menuitem" data-action="ordered-list">Ordered List</button>
        <button role="menuitem" data-action="quote">Block Quote</button>
        <button role="menuitem" data-action="code-block">Code Fences</button>
        <button role="menuitem" data-action="table">Table…</button>
        <hr />
        <button role="menuitem" data-action="table-add-row">Add Row <span>Ctrl+Enter</span></button>
        <button role="menuitem" data-action="table-add-column">Add Column</button>
        <button role="menuitem" data-action="table-delete-row">Delete Row</button>
        <button role="menuitem" data-action="table-delete-column">Delete Column</button>
        <button role="menuitem" data-action="table-align-left">Align Column Left</button>
        <button role="menuitem" data-action="table-align-center">Align Column Center</button>
        <button role="menuitem" data-action="table-align-right">Align Column Right</button>
      </div>
      <div class="menu-popup" id="menu-format" role="menu" hidden>
        <button role="menuitem" data-action="bold">Strong <span>Ctrl+B</span></button>
        <button role="menuitem" data-action="italic">Emphasis <span>Ctrl+I</span></button>
        <button role="menuitem" data-action="strike">Strikethrough</button>
        <button role="menuitem" data-action="inline-code">Inline Code</button>
        <button role="menuitem" data-action="link">Link… <span>Ctrl+K</span></button>
        <button role="menuitem" data-action="image">Image…</button>
      </div>
      <div class="menu-popup" id="menu-view" role="menu" hidden>
        <button role="menuitem" data-action="outline">Show Outline Panel <span>Ctrl+Shift+O</span></button>
        <button role="menuitem" data-action="files">Show File Panel</button>
        <button role="menuitem" data-action="status-bar">Show Status Bar</button>
        <hr />
        <button role="menuitem" data-action="source">Source Code Mode <span>Ctrl+/</span></button>
        <button role="menuitem" data-action="focus">Focus Mode <span>Ctrl+Shift+0</span></button>
        <button role="menuitem" data-action="typewriter">Typewriter Mode <span>Ctrl+Shift+T</span></button>
        <button role="menuitem" data-action="word-count">Word Count</button>
        <hr />
        <button role="menuitem" data-action="fullscreen">Toggle Fullscreen <span>F11</span></button>
        <button role="menuitem" data-action="zoom-in">Zoom In <span>Ctrl+Shift+=</span></button>
        <button role="menuitem" data-action="zoom-out">Zoom Out <span>Ctrl+Shift+-</span></button>
        <button role="menuitem" data-action="zoom-reset">Actual Size <span>Ctrl+0</span></button>
      </div>
      <div class="menu-popup" id="menu-theme" role="menu" hidden>
        <button role="menuitem" data-theme="github">GitHub</button>
        <button role="menuitem" data-theme="newsprint">Newsprint</button>
        <button role="menuitem" data-theme="night">Night</button>
      </div>
      <div class="menu-popup menu-popup-right" id="menu-help" role="menu" hidden>
        <button role="menuitem" data-action="about">关于 Typora RS</button>
        <button role="menuitem" data-action="shortcuts">快捷键</button>
      </div>
    </header>

    <div id="preferences-dialog" class="preferences-backdrop" hidden>
      <section class="preferences-window" role="dialog" aria-modal="true" aria-labelledby="preferences-title">
        <header class="preferences-header"><div><h2 id="preferences-title">Preferences</h2><p>Customize your writing environment</p></div><button id="preferences-close" class="preferences-close" aria-label="Close preferences">×</button></header>
        <div class="preferences-body">
          <nav class="preferences-nav" aria-label="Preference categories">
            <button class="preferences-tab selected" data-preference-tab="files">Files</button>
            <button class="preferences-tab" data-preference-tab="editor">Editor</button>
            <button class="preferences-tab" data-preference-tab="image">Image</button>
            <button class="preferences-tab" data-preference-tab="markdown">Markdown</button>
            <button class="preferences-tab" data-preference-tab="export">Export</button>
            <button class="preferences-tab" data-preference-tab="appearance">Appearance</button>
            <button class="preferences-tab" data-preference-tab="general">General</button>
          </nav>
          <div class="preferences-content">
            <section class="preferences-panel" data-preference-panel="files">
              <h3>Files</h3>
              <label class="preference-row"><span><b>Save recovery drafts</b><small>Keep a local draft while you edit.</small></span><input type="checkbox" data-pref="autoRecover"></label>
              <label class="preference-row"><span><b>Offer draft recovery on startup</b><small>Ask whether to restore an unsaved draft.</small></span><input type="checkbox" data-pref="restoreDraft"></label>
              <label class="preference-row"><span><b>Auto save open documents</b><small>Save named documents periodically while editing.</small></span><input type="checkbox" data-pref="autoSave"></label>
              <label class="preference-row stacked"><span><b>Auto save interval</b></span><select data-pref="autoSaveInterval"><option value="1">Every minute</option><option value="5">Every 5 minutes</option><option value="10">Every 10 minutes</option></select></label>
              <label class="preference-row"><span><b>Save before switching files</b><small>Save the current named document before opening another.</small></span><input type="checkbox" data-pref="saveOnSwitch"></label>
              <label class="preference-row stacked"><span><b>Default line endings for new files</b></span><select data-pref="defaultLineEnding"><option value="lf">Unix (LF)</option><option value="crlf">Windows (CRLF)</option></select></label>
            </section>
            <section class="preferences-panel" data-preference-panel="editor" hidden>
              <h3>Editor</h3>
              <label class="preference-row"><span><b>Spell check</b><small>Use the system WebView dictionary.</small></span><input type="checkbox" data-pref="spellCheck"></label>
              <label class="preference-row stacked"><span><b>Editor font</b></span><select data-pref="fontFamily"><option value="sans">Sans Serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select></label>
              <label class="preference-row stacked"><span><b>Font size <output data-pref-output="fontSize"></output></b></span><input type="range" min="13" max="24" step="1" data-pref="fontSize"></label>
              <label class="preference-row stacked"><span><b>Line height <output data-pref-output="lineHeight"></output></b></span><input type="range" min="1.2" max="2.2" step="0.1" data-pref="lineHeight"></label>
              <label class="preference-row stacked"><span><b>Source tab width</b></span><select data-pref="tabSize"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="8">8 spaces</option></select></label>
              <label class="preference-row"><span><b>Auto pair brackets and quotes</b><small>Insert the closing character when typing an opener.</small></span><input type="checkbox" data-pref="autoPair"></label>
              <label class="preference-row"><span><b>Auto format headings and lists</b><small>Turn Markdown prefixes into formatted blocks when followed by a space.</small></span><input type="checkbox" data-pref="autoFormatMarkdown"></label>
              <label class="preference-row"><span><b>Wrap long code lines</b></span><input type="checkbox" data-pref="wrapCode"></label>
              <label class="preference-row"><span><b>Show code line numbers</b></span><input type="checkbox" data-pref="codeLineNumbers"></label>
            </section>
            <section class="preferences-panel" data-preference-panel="image" hidden>
              <h3>Image</h3>
              <label class="preference-row stacked"><span><b>Copy inserted images to</b><small>Choose where imported images are stored beside the Markdown file.</small></span><select data-pref="imageLocation"><option value="document-assets">Document.assets folder</option><option value="assets">assets folder</option><option value="same-folder">Same folder as the document</option></select></label>
              <label class="preference-row"><span><b>Add ./ to relative image paths</b></span><input type="checkbox" data-pref="relativeImageDot"></label>
            </section>
            <section class="preferences-panel" data-preference-panel="markdown" hidden>
              <h3>Markdown</h3>
              <label class="preference-row"><span><b>Smart punctuation</b><small>Convert quotes, ellipses, and dashes to typographic characters.</small></span><input type="checkbox" data-pref="smartPunctuation"></label>
              <label class="preference-row"><span><b>Inline and display math</b></span><input type="checkbox" data-pref="enableMath"></label>
              <label class="preference-row"><span><b>Subscript</b><small>Enable H~2~O syntax.</small></span><input type="checkbox" data-pref="enableSubscript"></label>
              <label class="preference-row"><span><b>Superscript</b><small>Enable x^2^ syntax.</small></span><input type="checkbox" data-pref="enableSuperscript"></label>
              <label class="preference-row"><span><b>Emoji shortcodes</b><small>Convert supported names such as :smile: to emoji.</small></span><input type="checkbox" data-pref="emojiShortcodes"></label>
              <label class="preference-row"><span><b>Treat single line breaks as hard breaks</b></span><input type="checkbox" data-pref="hardLineBreaks"></label>
            </section>
            <section class="preferences-panel" data-preference-panel="export" hidden>
              <h3>Export</h3>
              <label class="preference-row"><span><b>Use current theme in HTML export</b><small>Apply your selected theme and editor typography.</small></span><input type="checkbox" data-pref="exportTheme"></label>
              <label class="preference-row"><span><b>Include document outline</b><small>Add linked headings at the top of exported HTML.</small></span><input type="checkbox" data-pref="exportOutline"></label>
              <label class="preference-row"><span><b>Start each top-level section on a new page</b><small>Applied to print and PDF output.</small></span><input type="checkbox" data-pref="pageBreakHeadings"></label>
            </section>
            <section class="preferences-panel" data-preference-panel="appearance" hidden>
              <h3>Appearance</h3>
              <label class="preference-row stacked"><span><b>Theme</b></span><select data-pref="theme"><option value="github">GitHub</option><option value="newsprint">Newsprint</option><option value="night">Night</option></select></label>
              <label class="preference-row stacked"><span><b>Document width <output data-pref-output="contentWidth"></output></b></span><input type="range" min="680" max="1200" step="20" data-pref="contentWidth"></label>
              <label class="preference-row stacked"><span><b>UI zoom <output data-pref-output="zoom"></output></b></span><input type="range" min="80" max="130" step="5" data-pref="zoom"></label>
            </section>
            <section class="preferences-panel" data-preference-panel="general" hidden>
              <h3>General</h3>
              <label class="preference-row stacked"><span><b>Startup sidebar</b><small>Choose which panel opens when Typora RS starts.</small></span><select data-pref="startupSidebar"><option value="none">Hidden</option><option value="outline">Outline</option><option value="files">Files</option></select></label>
              <label class="preference-row"><span><b>Show status bar</b><small>Display word count and editor controls.</small></span><input type="checkbox" data-pref="statusBar"></label>
              <label class="preference-row"><span><b>Keep caret centered in Typewriter Mode</b><small>Scroll the active paragraph toward the middle as you type.</small></span><input type="checkbox" data-pref="typewriterCenter"></label>
              <button id="preferences-reset" class="preferences-reset">Restore defaults</button>
            </section>
          </div>
        </div>
        <footer class="preferences-footer"><span>Changes are saved automatically.</span><button id="preferences-done">Done</button></footer>
      </section>
    </div>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" hidden>
        <div class="sidebar-tabs">
          <button class="sidebar-tab selected" data-panel="outline">Outline</button>
          <button class="sidebar-tab" data-panel="files">Files</button>
          <button id="close-sidebar" class="sidebar-close" aria-label="关闭侧栏">×</button>
        </div>
        <section id="outline-panel" class="sidebar-panel">
          <div id="outline" class="outline"><div class="sidebar-empty">Headings will appear here</div></div>
        </section>
        <section id="files-panel" class="sidebar-panel" hidden>
          <div class="file-panel-top">
            <div class="file-panel-actions">
              <button id="open-folder" class="open-folder-button">打开文件夹…</button>
              <button id="folder-up" title="返回上级目录" aria-label="返回上级目录">↑</button>
              <button id="folder-refresh" title="刷新目录" aria-label="刷新目录">↻</button>
              <button id="folder-copy" title="复制完整路径" aria-label="复制完整路径">⧉</button>
            </div>
            <div id="folder-location" class="folder-location"></div>
            <input id="file-filter" class="file-filter" type="search" placeholder="筛选文件…" aria-label="筛选文件" />
          </div>
          <div class="sidebar-empty">Open a folder to browse Markdown documents</div>
        </section>
      </aside>

      <main id="main-area" class="main-area">
        <div id="editor" class="document" contenteditable="true" spellcheck="false" aria-label="Markdown document" role="textbox" aria-multiline="true"></div>
        <textarea id="source" class="source-editor" aria-label="Markdown source" spellcheck="false" hidden></textarea>
      </main>
    </div>

    <div id="table-toolbar" class="table-toolbar" hidden aria-label="Table editing">
      <button data-table-action="add-row" title="Add row">＋ Row</button>
      <button data-table-action="add-column" title="Add column">＋ Col</button>
      <button data-table-action="delete-row" title="Delete row">− Row</button>
      <button data-table-action="delete-column" title="Delete column">− Col</button>
      <span></span>
      <button data-table-action="align-left" title="Align left">↤</button>
      <button data-table-action="align-center" title="Align center">↔</button>
      <button data-table-action="align-right" title="Align right">↦</button>
    </div>

    <div id="findbar" class="findbar" hidden>
      <input id="find-input" type="search" placeholder="查找" aria-label="查找文本" />
      <span id="find-count"></span>
      <button id="find-prev" title="上一个">↑</button>
      <button id="find-next" title="下一个">↓</button>
      <button id="replace-toggle" title="显示替换">Replace</button>
      <button id="find-close" title="关闭">×</button>
      <div id="replace-row" class="replace-row" hidden>
        <input id="replace-input" type="text" placeholder="替换为" aria-label="替换为" />
        <button id="replace-current">Replace</button>
        <button id="replace-all">Replace All</button>
      </div>
    </div>

    <div id="word-popover" class="word-popover" hidden></div>

    <footer class="statusbar">
      <div class="status-left">
        <button id="toggle-sidebar" class="status-icon" title="切换侧栏">☷</button>
        <button id="toggle-source" class="source-toggle" title="源码模式 (Ctrl+/)">&lt;/&gt;</button>
      </div>
      <div id="status-center" class="status-center"></div>
      <button id="word-count" class="word-count" title="Show word count">0 Words</button>
    </footer>
  </body>
</html>
